<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updated Links Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            color: #007BFF;
            text-align: center;
            margin-bottom: 30px;
        }
        ul {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        li {
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        a {
            text-decoration: none;
            color: #007BFF;
            font-size: 1.1em;
            display: block;
            padding: 5px 0;
        }
        a:hover {
            text-decoration: underline;
            color: #0056b3;
        }
        .local-link {
            color: #d9534f; /* Style for localhost links */
        }
        .remote-link {
            color: #5cb85c; /* Style for remote links */
        }
    </style>
</head>
<body>

    <h1>API and Development Links 🔗</h1>

    <ul>
        <li><a href="https://ldmathes.cc" target="_blank" class="remote-link">Ldmathes CC (Main Site)</a></li>
        <li><a href="https://github.com/dennyrgood" target="_blank" class="remote-link">Dennyrgood GitHub Profile</a></li>
        <li><a href="https://api.ldmathes.cc/api/health" target="_blank" class="remote-link">ldmathes Production API Health</a></li>
        <li><a href="https://api-edit.ldmathes.cc/api/health" target="_blank" class="remote-link">ldmathes Staging API Health</a></li>
        <li><a href="http://localhost:5000/api/health" target="_blank" class="local-link">Local API Health (Port 5000)</a></li>
        <li><a href="http://localhost:5001/api/health" target="_blank" class="local-link">Local API Health (Port 5001)</a></li>
    </ul>

</body>
</html>
