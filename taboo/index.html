<title>Taboo Cards</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1d1f; --muted:#6b6b6b; --accent:#a8321e; --line:#e6dfd3; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:24px;
         padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                 max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
         background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  #timer { font-size:2.5rem; font-variant-numeric:tabular-nums; color:var(--muted); }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:16px;
          padding:28px 24px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
  #word { font-size:2.4rem; font-weight:700; margin:0 0 16px; overflow-wrap:anywhere; }
  .label { color:var(--accent); font-weight:600; font-size:.9rem; text-transform:uppercase;
           letter-spacing:.05em; margin-bottom:8px; }
  #taboo { list-style:none; margin:0; padding:0; }
  #taboo li { font-size:1.3rem; padding:10px 0; border-bottom:1px solid var(--line); }
  #next { width:100%; max-width:420px; padding:18px; font-size:1.3rem; font-weight:600; border:0;
          border-radius:12px; background:var(--ink); color:#fff; cursor:pointer; touch-action:manipulation; }
  #next:active { transform:scale(.98); }
</style>
</head>
<body>
  <div id="timer">00:00</div>
  <div class="card">
    <h1 id="word"></h1>
    <div class="label">Don't say</div>
    <ul id="taboo"></ul>
  </div>
  <button id="next">Next</button>

const cards = CSV.trim().split("\n").map(line => {
  const [word, ...taboo] = line.split(",");
  return { word, taboo: taboo.filter(t => t.trim() !== "") };   // drops the ESL padding field
});

// Shuffle-deck: no repeats until all cards have been shown
let deck = [];
let current = null;
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function draw() {
  if (deck.length === 0) {
    deck = shuffle(cards.slice());
    // avoid showing the same card twice across a reshuffle
    if (current && deck[deck.length - 1] === current) [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
  }
  return deck.pop();
}

// Display-only count-up stopwatch
const timerEl = document.getElementById("timer");
let start = Date.now();
function tick() {
  const s = Math.floor((Date.now() - start) / 1000);
  timerEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
setInterval(tick, 250);

function next() {
  current = draw();
  document.getElementById("word").textContent = current.word;
  const ul = document.getElementById("taboo");
  ul.replaceChildren(...current.taboo.map(t => {
    const li = document.createElement("li");
    li.textContent = t;
    return li;
  }));
  start = Date.now();
  tick();
}

const btn = document.getElementById("next");
btn.addEventListener("click", () => { next(); btn.blur(); });   // blur so Space/Enter can't fire twice
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "Enter") {
    e.preventDefault();
    if (!e.repeat) next();
  }
