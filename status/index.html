<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Status Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        body { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .text-glow-green { text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .text-glow-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body class="bg-[#05070a] text-slate-300 min-h-screen p-4 md:p-6 selection:bg-emerald-500/30">

    <div class="max-w-[1800px] mx-auto">
        <!-- Dashboard Header -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6 border-b border-white/5 pb-8">
            <div>
                <h1 class="text-4xl font-black tracking-tighter text-white flex items-center gap-2">
                    FLEET_OPS <span class="text-emerald-500 animate-pulse">_</span>
                </h1>
                <div id="sub-header" class="text-[10px] text-slate-500 mt-2 tracking-[0.3em] uppercase flex items-center gap-3">
                    <span id="source-node">---</span> 
                    <span class="text-slate-800">/</span> 
                    <span id="sync-time">SYNC_PENDING</span>
                </div>
            </div>

            <!-- Summary Stats -->
            <div id="summary-container" class="flex gap-3 overflow-x-auto no-scrollbar">
                <!-- Injected via JS -->
            </div>

            <div id="global-status" class="px-4 py-2 rounded-lg bg-slate-900/50 border border-white/5 flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-slate-700"></div>
                <span class="text-[10px] font-bold tracking-widest text-slate-500">INITIALIZING</span>
            </div>
        </header>

        <!-- Machine Grid -->
        <main id="machine-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
            <!-- Injected via JS -->
        </main>

        <footer class="mt-12 flex justify-between items-center text-[9px] text-slate-600 tracking-[0.4em] uppercase opacity-50">
            <div>&copy; 2026 LD MATHES</div>
            <div class="flex gap-4">
                <span>Backup: Off</span>
                <span>Poll: 30s</span>
            </div>
        </footer>
    </div>

    <script>
        const API_BASE = "https://fleet.ldmathes.cc";

        async function updateDashboard() {
            try {
                const response = await fetch(`${API_BASE}/api/status`, { mode: 'cors' });
                if (!response.ok) throw new Error('OFFLINE');
                const data = await response.json();
                
                renderSummary(data.summary);
                renderGrid(data.machines);
                renderHeader(data.meta);
            } catch (err) {
                document.getElementById('global-status').innerHTML = `<div class="w-2 h-2 rounded-full bg-red-500 status-pulse"></div> <span class="text-red-500 text-[10px] font-bold tracking-widest uppercase font-mono">LINK_LOST</span>`;
            }
        }

        function renderSummary(s) {
            const container = document.getElementById('summary-container');
            const stats = [
                { label: 'HOSTS', val: `${s.machines_up}/${s.machines_total}`, color: 'emerald' },
                { label: 'SVC', val: `${s.services_up}/${s.services_total}`, color: 'blue' },
                { label: 'PUB', val: `${s.public_endpoints_up}/${s.public_endpoints_total}`, color: 'purple' }
            ];
            container.innerHTML = stats.map(st => `
                <div class="bg-slate-900/30 border border-white/5 p-3 rounded-lg min-w-[100px]">
                    <div class="text-[8px] font-bold text-slate-500 tracking-widest mb-1">${st.label}</div>
                    <div class="text-lg font-bold text-${st.color}-400">${st.val}</div>
                </div>
            `).join('');
        }

        function renderGrid(machines) {
            const grid = document.getElementById('machine-grid');
            grid.innerHTML = machines.map(m => {
                const isUp = m.host.status === 'up';
                return `
                <div class="bg-slate-900/20 border ${isUp ? 'border-white/5' : 'border-red-900/30'} rounded-xl p-5 hover:bg-slate-900/40 transition-all group">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-white font-bold text-sm tracking-tight group-hover:text-emerald-400 transition-colors">${m.machine.display_name.toUpperCase()}</h2>
                            <p class="text-[9px] text-slate-500 mt-1 uppercase">${m.machine.primary_role}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] text-slate-600">${m.host.response_time_ms || 0}ms</span>
                            <div class="w-2 h-2 rounded-full ${isUp ? 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]' : 'bg-red-500 status-pulse'}"></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        ${m.services.map(s => {
                            const svcUp = (s.public_check?.status === 'up') || (s.tailscale_check?.status === 'up');
                            const detail = s.tailscale_check?.detail || s.public_check?.detail || "";
                            return `
                            <div class="border-l border-white/5 pl-3 py-0.5">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[8px] px-1 bg-slate-800 text-slate-400 rounded">${s.priority}</span>
                                        <span class="text-[11px] text-slate-300 font-bold">${s.name}</span>
                                    </div>
                                    <span class="text-[10px] font-bold ${svcUp ? 'text-emerald-500/80' : 'text-red-500/80'}">${svcUp ? 'OK' : 'ERR'}</span>
                                </div>
                                ${detail ? `<p class="text-[9px] text-slate-600 mt-1 leading-tight line-clamp-2 uppercase">${detail.replace(' — service alive', '')}</p>` : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="mt-6 pt-4 border-t border-white/5 flex justify-between items-center opacity-20 group-hover:opacity-100 transition-opacity">
                        <span class="text-[9px] font-mono">${m.machine.tailscale_ip}</span>
                        <span class="text-[9px] font-mono">${m.machine.tailscale_name}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderHeader(meta) {
            document.getElementById('source-node').innerText = `SRC: ${meta.checker_host.toUpperCase()}`;
            document.getElementById('sync-time').innerText = `T: ${new Date(meta.timestamp_utc).toLocaleTimeString()}`;
            document.getElementById('global-status').innerHTML = `<div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div> <span class="text-emerald-500 text-[10px] font-bold tracking-widest uppercase">OPERATIONAL</span>`;
        }

        updateDashboard();
        setInterval(updateDashboard, 30000);
    </script>
</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Status Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .text-glow { text-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .card-shadow { box-shadow: 0 10px 30px -15px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-100 min-h-screen p-4 md:p-8 font-sans selection:bg-emerald-500/30 tracking-tight">

    <div class="max-w-[1700px] mx-auto">
        <!-- Header Section -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-10 border-b border-slate-800 pb-10 gap-8">
            <div class="flex-shrink-0">
                <h1 class="text-6xl font-black tracking-tighter text-white">FLEET<span class="text-emerald-500 text-glow">_</span>STATUS</h1>
                <div id="sub-header" class="text-slate-500 font-mono text-[10px] mt-3 uppercase tracking-[0.3em] flex items-center gap-2">
                    <span class="inline-block w-8 h-[1px] bg-slate-800"></span>
                    CONNECTING...
                </div>
            </div>
            
            <!-- Summary Bar -->
            <div id="summary-bar" class="flex gap-4 overflow-x-auto pb-2 w-full lg:w-auto no-scrollbar">
                <!-- Summary cards injected here -->
            </div>

            <div id="global-indicator" class="px-6 py-3 rounded-2xl bg-slate-900/50 border border-slate-800 font-bold flex items-center gap-4 whitespace-nowrap shadow-2xl backdrop-blur-md">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-700"></div>
                <span class="text-slate-500 text-[10px] tracking-[0.25em] uppercase">Initialising</span>
            </div>
        </div>

        <!-- Grid -->
        <div id="machine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 items-start">
            <!-- Machine cards injected here -->
        </div>

        <footer class="mt-20 flex flex-col md:flex-row justify-between items-center gap-6 text-slate-600 text-[10px] font-mono uppercase tracking-[0.2em] border-t border-slate-900/50 pt-10">
            <div class="flex items-center gap-4">
                <span class="opacity-50 font-bold">&copy; 2026 LD MATHES FLEET OPS</span>
                <span class="text-slate-800">/</span>
                <span id="refresh-indicator" class="text-slate-500">POLL_INTERVAL: 60S</span>
            </div>
            <div class="flex gap-8">
                <a href="#" class="hover:text-emerald-400 transition-all duration-300 hover:tracking-[0.3em]">Documentation</a>
                <a href="#" class="hover:text-emerald-400 transition-all duration-300 hover:tracking-[0.3em]">API_Node</a>
            </div>
        </footer>
    </div>

    <script>
        const API_BASE = "https://fleet.ldmathes.cc";

        async function updateDashboard() {
            try {
                const response = await fetch(`${API_BASE}/api/status`, { mode: 'cors' });
                if (!response.ok) throw new Error('API_OFFLINE');
                
                const data = await response.json();
                
                renderSummary(data.summary);
                renderGrid(data.machines);
                updateHeader(data.meta);
            } catch (err) {
                console.error("Dashboard Sync Error:", err);
                document.getElementById('sub-header').innerHTML = `<span class="inline-block w-8 h-[1px] bg-red-900"></span> <span class="text-red-900">CONNECTION_LOST - RETRYING...</span>`;
                document.getElementById('global-indicator').innerHTML = `<div class="w-2.5 h-2.5 rounded-full bg-red-500 status-pulse"></div> <span class="text-red-500 text-[10px] tracking-[0.2em]">OFFLINE</span>`;
            }
        }

        function renderSummary(summary) {
            const container = document.getElementById('summary-bar');
            if (!summary) return;

            const items = [
                { label: 'FLEET', val: `${summary.machines_up}/${summary.machines_total}`, color: 'emerald' },
                { label: 'SERVICES', val: `${summary.services_up}/${summary.services_total}`, color: 'blue' },
                { label: 'PUBLIC', val: `${summary.public_endpoints_up}/${summary.public_endpoints_total}`, color: 'purple' }
            ];

            container.innerHTML = items.map(i => `
                <div class="bg-slate-900/40 backdrop-blur-md border border-slate-800/50 p-5 rounded-2xl min-w-[160px] shadow-lg hover:border-slate-700 transition-colors duration-500">
                    <div class="text-[9px] text-slate-500 font-bold tracking-[0.2em] mb-2 uppercase opacity-60">${i.label}</div>
                    <div class="text-3xl font-black text-${i.color}-400 font-mono tracking-tighter">${i.val}</div>
                </div>
            `).join('');
        }

        function renderGrid(machines) {
            const grid = document.getElementById('machine-grid');
            grid.innerHTML = '';

            machines.forEach(m => {
                const name = m.machine.display_name;
                const role = m.machine.primary_role;
                const latency = m.host.response_time_ms;
                const isOnline = m.host.status === "up";
                
                const card = document.createElement('div');
                card.className = `group flex flex-col p-7 rounded-[2rem] border-2 transition-all duration-700 card-shadow ${isOnline ? 'bg-slate-900/20 border-slate-800/40 hover:border-slate-500/50 hover:bg-slate-900/40' : 'bg-red-950/10 border-red-900/30'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-8">
                        <div class="max-w-[70%]">
                            <h2 class="text-xl font-black tracking-tight leading-none text-white group-hover:text-emerald-400 transition-all duration-500">${name.toUpperCase()}</h2>
                            <p class="text-[10px] font-mono text-slate-500 uppercase mt-3 tracking-widest opacity-70">${role}</p>
                        </div>
                        <div class="flex items-center gap-2.5 bg-slate-950/80 px-3 py-1.5 rounded-xl border border-white/5 shadow-inner">
                            <span class="text-[10px] font-mono text-slate-500 font-bold">${latency ? latency + 'ms' : '---'}</span>
                            <div class="w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]' : 'bg-red-500 shadow-[0_0_12px_rgba(239,68,68,0.6)] status-pulse'}"></div>
                        </div>
                    </div>
                    
                    <div class="flex-grow space-y-5">
                        ${m.services.map(s => {
                            const isUp = (s.public_check && s.public_check.status === "up") || 
                                         (s.tailscale_check && s.tailscale_check.status === "up");
                            
                            const detail = s.tailscale_check?.detail || s.public_check?.detail || "";
                            const cleanDetail = detail.replace(' — service alive', '').replace('Connection timeout', 'Timeout').replace('Host unreachable', 'Offline');
                            
                            return `
                            <div class="group/service flex flex-col">
                                <div class="flex justify-between items-center text-[12px] font-mono">
                                    <span class="text-slate-400 group-hover/service:text-white transition-colors uppercase tracking-tighter">${s.name}</span>
                                    <span class="font-black tracking-tighter ${isUp ? 'text-emerald-500' : 'text-red-500/80'}">${isUp ? 'UP' : 'DOWN'}</span>
                                </div>
                                ${cleanDetail ? `<p class="text-[10px] text-slate-500/80 font-mono mt-1.5 leading-relaxed break-words group-hover/service:text-slate-300 transition-colors" title="${detail}">${cleanDetail}</p>` : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="mt-10 pt-5 border-t border-white/5 flex justify-between items-center opacity-20 group-hover:opacity-100 transition-all duration-700">
                        <span class="text-[10px] font-mono text-slate-500 tabular-nums">${m.machine.tailscale_ip}</span>
                        <span class="text-[10px] font-mono text-slate-400 uppercase tracking-tighter">${m.machine.tailscale_name.replace('amsterdamdesktop', 'amsterdam')}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateHeader(meta) {
            if (!meta) return;
            let host = meta.checker_host || 'unknown';
            if(host.toLowerCase().includes('amsterdam')) host = 'AMSTERDAM';
            
            const timestamp = new Date(meta.timestamp_utc).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit', hour12: false});
            
            document.getElementById('sub-header').innerHTML = `<span class="inline-block w-8 h-[1px] bg-emerald-500/50"></span> NODE: ${host.toUpperCase()} <span class="text-slate-800 mx-2">/</span> SYNCED: ${timestamp} UTC`;
            document.getElementById('global-indicator').innerHTML = `<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"></div> <span class="text-emerald-500 text-[10px] tracking-[0.25em] uppercase">System Online</span>`;
        }

        updateDashboard();
        setInterval(updateDashboard, 60000);
    </script>
</body>
</html>
