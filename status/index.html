<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Status Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-4xl font-black tracking-tight text-white">FLEET_STATUS</h1>
                <p id="sub-header" class="text-slate-400 font-mono text-sm mt-1 uppercase tracking-widest">Initialising Link...</p>
            </div>
            <div id="global-indicator" class="mt-4 md:mt-0 px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 font-bold flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-slate-500"></div>
                <span class="text-slate-300">AWAITING DATA</span>
            </div>
        </div>

        <div id="machine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <footer class="mt-12 text-center text-slate-600 text-xs font-mono uppercase tracking-tighter">
            Data Source: <span id="source-node">---</span> | Refresh: 60s
        </footer>
    </div>

    <script>
        // CONFIGURATION: Set this to fleet-bkp.ldmathes.cc for the backup folder!
        const API_BASE = "https://fleet.ldmathes.cc";

        async function updateDashboard() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                if (!response.ok) throw new Error('API_OFFLINE');
                
                const data = await response.json();
                const checkerHost = response.headers.get('X-Checker-Host') || 'unknown';
                const dataAge = response.headers.get('X-Data-Age') || '0';

                renderGrid(data.machines);
                updateHeader(checkerHost, dataAge);
            } catch (err) {
                document.getElementById('sub-header').innerText = "CONNECTION_LOST";
                document.getElementById('global-indicator').innerHTML = `<div class="w-3 h-3 rounded-full bg-red-500 status-pulse"></div> ERROR`;
            }
        }

        function renderGrid(machines) {
            const grid = document.getElementById('machine-grid');
            grid.innerHTML = '';

            machines.forEach(m => {
                const isOnline = m.status === "online";
                const card = document.createElement('div');
                card.className = `card p-6 rounded-xl border-2 transition-all ${isOnline ? 'bg-slate-800/50 border-slate-700' : 'bg-red-900/20 border-red-900'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold tracking-tight">${m.name.toUpperCase()}</h2>
                        <div class="w-3 h-3 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-red-500 status-pulse'}"></div>
                    </div>
                    <div class="space-y-2">
                        ${m.services.map(s => `
                            <div class="flex justify-between text-sm font-mono border-b border-slate-700/50 pb-1">
                                <span class="text-slate-400">${s.name}</span>
                                <span class="${s.status === 'online' ? 'text-emerald-400' : 'text-red-400'}">${s.status.toUpperCase()}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateHeader(host, age) {
            document.getElementById('sub-header').innerText = `NODE: ${host} | AGE: ${age}s`;
            document.getElementById('source-node').innerText = host;
            document.getElementById('global-indicator').innerHTML = `<div class="w-3 h-3 rounded-full bg-emerald-500"></div> SYSTEM_READY`;
        }

        // Initial run and interval
        updateDashboard();
        setInterval(updateDashboard, 60000);
    </script>
</body>
</html>
