<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHack URL Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label, select, input, button { display: block; margin-bottom: 10px; }
        input[type="text"] { width: 300px; padding: 5px; box-sizing: border-box; }
        #generatedUrl { 
            border: 1px solid #ccc; 
            padding: 10px; 
            background-color: #f9f9f9; 
            word-break: break-all; 
            margin-top: 15px;
            min-height: 20px;
        }
        .note { font-size: 0.9em; color: gray; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>🔗 Generate and Open GitHack URL</h2>

    <form id="urlForm">
        <label for="repoSelect">1. Select Repository:</label>
        <select id="repoSelect">
            <option value="dennyrgood.github.io">dennyrgood.github.io</option>
            <option value="excel-web-interface">excel-web-interface</option>
            <option value="google-photos">google-photos</option>
            <option value="llm">llm</option>
            <option value="movies-shows-editor">movies-shows-editor</option>
            <option value="place-objects">place-objects</option>
            <option value="scripts">scripts</option>
            <option value="usdz-avp">usdz-avp</option>
            <option value="weather-dashboard">weather-dashboard</option>
            <option value="custom">-- Enter Custom Repo --</option>
        </select>

        <label for="customRepo" id="customRepoLabel" style="display:none;">(or) Enter Custom Repository Name:</label>
        <input type="text" id="customRepo" placeholder="e.g., my-awesome-project" style="display:none;">

        <label for="branchInput">2. Enter Branch Name:</label>
        <input type="text" id="branchInput" value="main" required>

        <button type="submit">3. Open Generated URL</button>
    </form>

    <h3>Generated URL:</h3>
    <div id="generatedUrl"></div>

    <p class="note">
        The URL updates automatically as you change the inputs. Clicking the button will open the displayed link in a new tab.
    </p>

    <script>
        const USERNAME = 'dennyrgood';
        const BASE_URL = 'https://raw.githack.com';
        const SUFFIX = 'index.html';

        const form = document.getElementById('urlForm');
        const repoSelect = document.getElementById('repoSelect');
        const customRepoInput = document.getElementById('customRepo');
        const customRepoLabel = document.getElementById('customRepoLabel');
        const branchInput = document.getElementById('branchInput');
        const generatedUrlDisplay = document.getElementById('generatedUrl');

        function getRepo() {
            if (repoSelect.value === 'custom') {
                return customRepoInput.value.trim();
            }
            return repoSelect.value;
        }

        function toggleCustomRepoInput() {
            const isCustom = repoSelect.value === 'custom';
            customRepoInput.style.display = isCustom ? 'block' : 'none';
            customRepoLabel.style.display = isCustom ? 'block' : 'none';
            if (isCustom) {
                customRepoInput.setAttribute('required', 'required');
            } else {
                customRepoInput.removeAttribute('required');
            }
        }

        function updateUrlDisplay() {
            const repo = getRepo();
            const branch = branchInput.value.trim();

            if (repo && branch) {
                const fullUrl = `${BASE_URL}/${USERNAME}/${repo}/${branch}/${SUFFIX}`;
                generatedUrlDisplay.innerHTML = `<a href="${fullUrl}" target="_blank">${fullUrl}</a>`;
            } else {
                generatedUrlDisplay.textContent = '...URL will appear here...';
            }
        }

        repoSelect.addEventListener('change', () => {
            toggleCustomRepoInput();
            updateUrlDisplay();
        });

        customRepoInput.addEventListener('input', updateUrlDisplay);
        branchInput.addEventListener('input', updateUrlDisplay);

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const repo = getRepo();
            const branch = branchInput.value.trim();

            if (!repo) {
                alert("Please enter a custom repository name or select a repository.");
                return;
            }
            if (!branch) {
                alert("Please enter a branch name.");
                return;
            }

            const urlToOpen = `${BASE_URL}/${USERNAME}/${repo}/${branch}/${SUFFIX}`;
            window.open(urlToOpen, '_blank');
        });

        toggleCustomRepoInput();
        updateUrlDisplay();
    </script>

</body>
</html>
