<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Status Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .text-glow { text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-100 min-h-screen p-4 md:p-8 font-sans selection:bg-emerald-500/30">

    <div class="max-w-[1600px] mx-auto">
        <!-- Header Section -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 border-b border-slate-800 pb-8 gap-6">
            <div class="flex-shrink-0">
                <h1 class="text-5xl font-black tracking-tighter text-white">FLEET<span class="text-emerald-500 text-glow">_</span>STATUS</h1>
                <p id="sub-header" class="text-slate-500 font-mono text-xs mt-2 uppercase tracking-[0.2em]">Connecting to Infrastructure...</p>
            </div>
            
            <!-- Summary Bar -->
            <div id="summary-bar" class="flex gap-4 overflow-x-auto pb-2 w-full lg:w-auto">
                <!-- Summary cards injected here -->
            </div>

            <div id="global-indicator" class="px-5 py-2.5 rounded-xl bg-slate-900 border border-slate-800 font-bold flex items-center gap-3 whitespace-nowrap shadow-xl">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
                <span class="text-slate-400 text-[10px] tracking-[0.2em] uppercase">Initialising</span>
            </div>
        </div>

        <!-- Grid -->
        <div id="machine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5">
            <!-- Machine cards injected here -->
        </div>

        <footer class="mt-16 flex flex-col md:flex-row justify-between items-center gap-4 text-slate-600 text-[10px] font-mono uppercase tracking-widest border-t border-slate-900 pt-8">
            <div class="flex items-center gap-4">
                <span>&copy; 2026 LD MATHES FLEET OPS</span>
                <span class="text-slate-800">|</span>
                <span id="refresh-indicator" class="text-slate-500">REFRESH: 60S</span>
            </div>
            <div class="flex gap-6">
                <a href="#" class="hover:text-emerald-500 transition-colors">Documentation</a>
                <a href="#" class="hover:text-emerald-500 transition-colors">API Docs</a>
            </div>
        </footer>
    </div>

    <script>
        const API_BASE = "https://fleet.ldmathes.cc";

        async function updateDashboard() {
            try {
                const response = await fetch(`${API_BASE}/api/status`, { mode: 'cors' });
                if (!response.ok) throw new Error('API_OFFLINE');
                
                const data = await response.json();
                
                renderSummary(data.summary);
                renderGrid(data.machines);
                updateHeader(data.meta);
            } catch (err) {
                console.error("Dashboard Sync Error:", err);
                document.getElementById('sub-header').innerText = "CONNECTION_LOST - RETRYING...";
                document.getElementById('global-indicator').innerHTML = `<div class="w-2.5 h-2.5 rounded-full bg-red-500 status-pulse"></div> <span class="text-red-500 text-[10px] tracking-[0.2em]">OFFLINE</span>`;
            }
        }

        function renderSummary(summary) {
            const container = document.getElementById('summary-bar');
            if (!summary) return;

            const items = [
                { label: 'FLEET', val: `${summary.machines_up}/${summary.machines_total}`, color: 'emerald', bg: 'emerald-500/5' },
                { label: 'SERVICES', val: `${summary.services_up}/${summary.services_total}`, color: 'blue', bg: 'blue-500/5' },
                { label: 'PUBLIC', val: `${summary.public_endpoints_up}/${summary.public_endpoints_total}`, color: 'purple', bg: 'purple-500/5' }
            ];

            container.innerHTML = items.map(i => `
                <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 p-4 rounded-xl min-w-[140px] shadow-lg">
                    <div class="text-[9px] text-slate-500 font-bold tracking-[0.1em] mb-1 uppercase">${i.label}</div>
                    <div class="text-2xl font-black text-${i.color}-400 font-mono tracking-tighter">${i.val}</div>
                </div>
            `).join('');
        }

        function renderGrid(machines) {
            const grid = document.getElementById('machine-grid');
            grid.innerHTML = '';

            machines.forEach(m => {
                const name = m.machine.display_name;
                const role = m.machine.primary_role;
                const latency = m.host.response_time_ms;
                const isOnline = m.host.status === "up";
                
                const card = document.createElement('div');
                card.className = `group flex flex-col p-6 rounded-2xl border-2 transition-all duration-500 ${isOnline ? 'bg-slate-900/30 border-slate-800/60 hover:border-slate-600 hover:bg-slate-900/50' : 'bg-red-950/10 border-red-900/40'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-lg font-black tracking-tight leading-none text-white group-hover:text-emerald-400 transition-colors">${name.toUpperCase()}</h2>
                            <p class="text-[9px] font-mono text-slate-500 uppercase mt-2 tracking-widest opacity-80">${role}</p>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-950/50 px-2 py-1 rounded-md border border-slate-800/50">
                            <span class="text-[9px] font-mono text-slate-500">${latency ? latency + 'ms' : '---'}</span>
                            <div class="w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.4)]' : 'bg-red-500 status-pulse'}"></div>
                        </div>
                    </div>
                    
                    <div class="flex-grow space-y-4">
                        ${m.services.map(s => {
                            const isUp = (s.public_check && s.public_check.status === "up") || 
                                         (s.tailscale_check && s.tailscale_check.status === "up");
                            
                            const detail = s.tailscale_check?.detail || s.public_check?.detail || "";
                            const cleanDetail = detail.replace(' — service alive', '').replace('Connection timeout', 'Timeout').replace('Host unreachable', 'Offline');
                            
                            return `
                            <div class="group/service flex flex-col">
                                <div class="flex justify-between items-center text-[11px] font-mono">
                                    <span class="text-slate-400 group-hover/service:text-emerald-200 transition-colors uppercase tracking-tight">${s.name}</span>
                                    <span class="font-bold tracking-tighter ${isUp ? 'text-emerald-500/90' : 'text-red-500/70'}">${isUp ? 'UP' : 'DOWN'}</span>
                                </div>
                                ${cleanDetail ? `<p class="text-[9px] text-slate-600 font-mono mt-1 leading-relaxed break-words opacity-80 group-hover/service:opacity-100" title="${detail}">${cleanDetail}</p>` : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="mt-8 pt-4 border-t border-slate-800/40 flex justify-between items-center opacity-30 group-hover:opacity-100 transition-all duration-500">
                        <span class="text-[9px] font-mono text-slate-500">${m.machine.tailscale_ip}</span>
                        <span class="text-[9px] font-mono text-slate-400 uppercase tracking-tighter">${m.machine.tailscale_name.replace('amsterdamdesktop', 'amsterdam')}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateHeader(meta) {
            if (!meta) return;
            // Clean up the host name (e.g., amsterdamdeskto -> amsterdam)
            let host = meta.checker_host || 'unknown';
            if(host.startsWith('amsterdam')) host = 'AMSTERDAM';
            
            const timestamp = new Date(meta.timestamp_utc).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            document.getElementById('sub-header').innerText = `NODE: ${host.toUpperCase()} | SYNCED: ${timestamp}`;
            document.getElementById('global-indicator').innerHTML = `<div class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div> <span class="text-emerald-500 text-[10px] tracking-[0.2em] uppercase">System Online</span>`;
        }

        updateDashboard();
        setInterval(updateDashboard, 60000);
    </script>
</body>
</html>
