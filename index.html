<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathes Online Utilities</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .project-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .project-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .project-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .project-card p {
            color: #666;
            margin-bottom: 25px;
            flex: 1;
            line-height: 1.6;
        }

        .project-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1em;
            text-align: center;
            display: inline-block;
            flex-basis: auto; /* Allow buttons to size based on content or flex layout */
            min-width: 100px;
        }
        
        /* Ensure primary and secondary buttons take up equal space if wrapped */
        .project-links a.btn {
            flex-grow: 1;
            flex-shrink: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-disabled {
            background: #f0f0f0;
            color: #999;
            opacity: 0.6;
            cursor: default;
        }
        
        /* New tertiary style for "old iPad" view */
        .btn-tertiary {
            background: #50c2c5;
            color: white;
        }
        
        .btn-tertiary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(80, 194, 197, 0.4);
        }

        .footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 40px;
            font-size: 0.9em;
        }

        /* Removed .status styles as they are no longer needed */

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .header p {
                font-size: 1em;
            }

            .projects-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .project-card {
                padding: 20px;
            }

            .project-links {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                margin-bottom: 10px; /* Add margin for spacing on mobile */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="site-title"></h1>
            <p id="site-tagline"></p>
        </div>

        <div id="projects-grid" class="projects-grid">
            <!-- Cards will be dynamically generated here -->
        </div>

        <div class="footer">
            <p id="footer-text"></p>
        </div>
    </div>

                        {

                        }
                    ]
                },

                
                // Movies & Shows (FORMERLY CARD 2)
                {
                    icon: "🎬",
                    title: "Movies & Shows",
                    description: "Full CRUD editor for your movies and shows collection. Add new entries, edit existing ones, or delete as needed. (Currently offline)",
                    buttons: [
                        {
                            text: "Full Editor",
                            url: "https://dennyrgood.github.io/movies-shows-editor/",
                            style: "primary"
                        },
                        {
                            text: "Quick Add",
                            url: "https://dennyrgood.github.io/excel-web-interface/",
                            style: "secondary"
                        }
                    ]
                },


                // Documentation
                {
                    icon: "📚",
                    title: "Documentation",
                    description: "Links to documentation and resources.",
                    buttons: [
                        {
                            "text": "Doc for repo: dennyrgood.github.io",
                            "url": "https://dennyrgood.github.io/Doc",

                        },

                        {

                        },

                        {

                        }
                    ]
                },

      
                // Utilties
                {
                    icon: "🔧",
                    title: "Utilties",
                    description: "This will be the card for various utilties:",
                    buttons: [
                        {
                            text: "Got to Photos Library",

                        },

                        {

                       {

                            url: "https://dennyrgood.github.io/raw.html",

                        }
                    ]
                },
                                // USDZ Objects (FORMERLY CARD 3)
                {
                    icon: "🥽",
                    title: "USDZ Objects",
                    description: "USDZ Objects for use with the Apple Vision Pro.",
                    buttons: [
                        {
                            text: "View Objects",

                    ]
                },
                // More Projects Coming
                {
                    icon: "🔄",
                    title: "More Projects Coming",
                    description: "This hub is ready to grow. New projects and editors will be added here as they're built.",
                    buttons: [
                        {
                            text: "Coming Soon",
                            url: "#",
                            style: "disabled"
                        }
                    ]
                }]
        };

        // ============================================================
        // RENDERING LOGIC (ES5 Compliant)
        // ============================================================

        // Render header
        function renderHeader() {
            document.getElementById('site-title').textContent = CONFIG.header.title;
            document.getElementById('site-tagline').textContent = CONFIG.header.tagline;
        }

        // Render footer
        function renderFooter() {
            document.getElementById('footer-text').textContent = CONFIG.footer.text;
        }

        // Render a single project card
        function renderProjectCard(project) {
            var card = document.createElement('div');
            card.className = 'project-card';

            // Icon
            var icon = document.createElement('div');
            icon.className = 'project-icon';
            icon.textContent = project.icon;
            card.appendChild(icon);

            // Title
            var title = document.createElement('h2');
            title.textContent = project.title;
            card.appendChild(title);

            // Description
            var description = document.createElement('p');
            description.textContent = project.description;
            card.appendChild(description);

            // Buttons container
            var linksDiv = document.createElement('div');
            linksDiv.className = 'project-links';

            // Using ES5 forEach and string concatenation
            project.buttons.forEach(function (button) {
                if (button.style === 'disabled') {
                    var span = document.createElement('span');
                    span.className = 'btn btn-disabled';
                    span.textContent = button.text;
                    linksDiv.appendChild(span);
                } else if (button.style !== 'ignore') {
                    var link = document.createElement('a');
                    link.href = button.url;
                    link.className = 'btn btn-' + button.style; // String concatenation
                    link.textContent = button.text;
                    linksDiv.appendChild(link);
                }
            });

            card.appendChild(linksDiv);
            return card;
        }

        // Render all project cards
        function renderProjects() {
            var grid = document.getElementById('projects-grid');
            grid.innerHTML = ''; // Clear existing cards

            // Using ES5 forEach
            CONFIG.projects.forEach(function (project) {
                grid.appendChild(renderProjectCard(project));
            });
        }

        // Initialize page
        function init() {
            renderHeader();
            renderFooter();
            renderProjects();
        }

        // Run on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>
